<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>La patria rinnegata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --marrone:#6B3A1D;
  --marrone-scuro:#4A2711;
  --inchiostro:#2B1B10;
  --carta:#FAF8F4;
  --sabbia:#E6D9C3;
  --verde:#3E6B4B;
  --muto:#6F6255;
  --serif:"Libre Caslon Text",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--carta);color:var(--inchiostro);font-family:var(--serif);line-height:1.65;font-size:17px}
.pagina{max-width:560px;margin:0 auto;padding:0 20px 48px}

.copertina{padding:32px 0 8px;text-align:center}
.cornice{display:inline-block;background:#fff;padding:10px 10px 12px;border:1px solid var(--sabbia);box-shadow:0 0 0 6px var(--marrone);max-width:78%;margin:6px 6px 0}
.cornice img{display:block;width:100%;height:auto}
.cornice figcaption{font-style:italic;font-size:13px;color:var(--muto);margin-top:8px;line-height:1.4}
h1{font-size:clamp(34px,10vw,48px);line-height:1.08;margin:32px 0 12px;font-weight:700;letter-spacing:-.01em;color:var(--marrone-scuro)}
.sottotitolo{font-style:italic;color:var(--muto);margin:0 auto;max-width:30ch;font-size:18px}

.avanzamento{position:sticky;top:0;z-index:5;background:var(--marrone);color:#fff;margin:28px -20px 24px;padding:10px 20px;font-size:15px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.avanzamento .barra{flex:1;height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.avanzamento .barra span{display:block;height:100%;width:0;background:#fff;transition:width .3s}

.tappa{background:#fff;border:2px solid var(--marrone);border-radius:10px;margin:0 0 22px;overflow:hidden}
.tappa header{background:var(--marrone);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 14px;margin:0}
.num{flex:none;width:44px;height:44px;border:2px solid #fff;border-radius:6px;display:grid;place-items:center;font-size:24px;font-weight:700;line-height:1}
.tappa h2{margin:0;font-size:19px;line-height:1.25;font-weight:700}
.corpo{padding:14px 16px 16px}
.indirizzo{margin:0 0 12px;font-size:14px;color:var(--muto);font-style:italic}
.descrizione{margin:0 0 16px}
.nota{font-size:14px;color:var(--muto);margin:-6px 0 16px}
.azioni{display:flex;gap:10px;flex-wrap:wrap}
.vai,.visitata{font:inherit;font-size:16px;min-height:48px;border-radius:8px;padding:0 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.vai{flex:1 1 140px;background:var(--marrone);color:#fff;font-weight:700;border:2px solid var(--marrone);outline:2px solid #fff;outline-offset:-5px}
.visitata{flex:1 1 140px;background:#fff;color:var(--marrone-scuro);border:2px solid var(--sabbia)}
.vai:focus-visible,.visitata:focus-visible{outline:3px solid var(--verde);outline-offset:2px}
.tappa.fatta{border-color:var(--verde)}
.tappa.fatta header{background:var(--verde)}
.tappa.fatta .descrizione{color:var(--muto)}
.tappa.fatta .visitata{background:var(--verde);border-color:var(--verde);color:#fff}

footer{text-align:center;font-size:14px;color:var(--muto);font-style:italic;border-top:1px solid var(--sabbia);padding-top:20px;margin-top:36px}
@media (prefers-reduced-motion:reduce){.avanzamento .barra span{transition:none}}
</style>
</head>

  <h1>La patria rinnegata</h1>
  <p class="sottotitolo">Itinerario storico-didattico tra i luoghi dell’infanzia di Francesco Morzaniga</p>
</div>

<div class="avanzamento" role="status" aria-live="polite">
  <span id="conteggio">0 tappe su 8</span>
  <div class="barra"><span id="riempimento"></span></div>
</div>

<main id="tappe"></main>

<footer>Questo sito non è affiliato alla Pro Loco di Cogliate.</footer>
</div>

<script>
const TAPPE = [
 {nome:"Giochi Preziosi SPA", ind:"Via delle Primule, 5, 20815 Cogliate MB",
  txt:"Il 20 settembre 2005 Enrico Preziosi, all’epoca presidente del Genoa, venne posto agli arresti domiciliari proprio qui, nella sede centrale della sua azienda, per bancarotta fraudolenta. L’episodio è ancora oggi ricordato dai cogliatesi con orgoglio, non si sa se nei confronti delle forze dell’ordine o di Preziosi."},
 {nome:"Le Api del Mauro", ind:"Via Piave, 79/2, 20815 Cogliate MB",
  txt:"Questo tizio che alleva api contro la loro volontà ha acquistato la casa natale* di Francesco Morzaniga senza neanche metterci una targa. Non conosciamo l’attuale stato di conservazione della casa, che una volta era la villetta bifamiliare più gioiosa del quartiere.",
  nota:"*Con “casa natale” si intende la casa in cui Francesco Morzaniga è cresciuto. Come tutti sanno, Francesco Morzaniga è nato a Milano."},
 {nome:"Scuola Primaria Cesare Battisti", ind:"Via Cesare Battisti, 19, 20815 Cogliate MB",
  txt:"La scuola elementare di Francesco Morzaniga. Un suo busto in bronzo è attualmente esposto al secondo piano, nel corridoio degli ex studenti illustri."},
 {nome:"Bar centro", ind:"SP133, 1, 20815 Cogliate MB",
  txt:"Proprio accanto alla sede della Lega Nord, era il bar da cui partiva il pullman che portava l’Inter Club Cogliate a San Siro. Oggi è chiuso definitivamente per motivi che preferiamo non approfondire."},
 {nome:"Oratorio Cardinal Minoretti", ind:"Via Cardinal Minoretti, 49, 20815 Cogliate MB",
  txt:"Storico campo della Cogliatese Calcio. Qui Francesco Morzaniga, noto con i soprannomi di “piscinin brut e catif” e di “piccolo Emre”, giocò in maniera incredibile per circa sei mesi e in maniera mediocre per altri 10 anni e sei mesi."},
 {nome:"Scuola Secondaria di I° grado “D. Buzzati”", ind:"Viale Rimembranze, 15, 20815 Cogliate MB",
  txt:"La scuola media in cui il Morzaniga imparò i fondamenti della storia, della letteratura e del bullismo. La scuola ospita la palestra in cui si fratturò il polso per una pallonata, particolare che certamente non disincentivò il bullismo."},
 {nome:"Autoscuola Solarese", ind:"Via Dante Alighieri, 28, 20815 Cogliate MB",
  txt:"In questa autoscuola Francesco Morzaniga conseguì la patente alla precocissima età di 18 anni. L’esame finale si tenne nella metropoli tentacolare di Seregno."},
 {nome:"La Madonnina", ind:"Via Francesco Petrarca, 6, 20815 Cogliate MB",
  txt:"Il ristorante in cui la Cogliate Bene si ritrova per festeggiare le ricorrenze. Francesco, esponente delle classi popolari, ci è andato una volta sola."}
];

const KEY = "patria-rinnegata-visitate";
let fatte = [];
try { fatte = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e) { fatte = []; }
function salva(){ try { localStorage.setItem(KEY, JSON.stringify(fatte)); } catch(e) {} }

const radice = document.getElementById("tappe");
TAPPE.forEach((t, i) => {
  const url = "https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=" + encodeURIComponent(t.nome + ", " + t.ind);
  const el = document.createElement("article");
  el.className = "tappa";
  el.innerHTML =
    '<header><div class="num">' + (i+1) + '</div><h2>' + t.nome + '</h2></header>' +
    '<div class="corpo">' +
      '<p class="indirizzo">' + t.ind + '</p>' +
      '<p class="descrizione">' + t.txt + '</p>' +
      (t.nota ? '<p class="nota">' + t.nota + '</p>' : '') +
      '<div class="azioni">' +
        '<a class="vai" href="' + url + '" target="_blank" rel="noopener">Vai</a>' +
        '<button class="visitata" type="button" aria-pressed="false">Visitata</button>' +
      '</div>' +
    '</div>';
  const btn = el.querySelector(".visitata");
  function aggiorna(){
    const f = fatte.includes(i);
    el.classList.toggle("fatta", f);
    btn.setAttribute("aria-pressed", f);
    btn.textContent = f ? "Visitata ✓" : "Visitata";
  }
  btn.addEventListener("click", () => {
    fatte = fatte.includes(i) ? fatte.filter(n => n !== i) : fatte.concat(i);
    salva(); aggiorna(); conteggio();
  });
  aggiorna();
  radice.appendChild(el);
});

function conteggio(){
  const n = fatte.length;
  document.getElementById("conteggio").textContent = n + (n === 1 ? " tappa su 8" : " tappe su 8");
  document.getElementById("riempimento").style.width = (n / TAPPE.length * 100) + "%";
}
conteggio();
</script>
